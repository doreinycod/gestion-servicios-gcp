# Variables de entorno del servicio en Cloud Run (SIN secretos: las claves van en Secret Manager).
# Cloud Build las aplica en cada despliegue. Cambia aquí los valores y haz push.

# Servidor
DATOS_DIR: /datos                      # bucket de Cloud Storage montado (adjuntos y XML)
TAREAS: "off"                          # las tareas programadas las dispara Cloud Scheduler (POST /api/tareas/...)
JWT_EXPIRES: 30m
# Después del primer despliegue, pon aquí la URL que te dio Cloud Run (o tu dominio):
FRONTEND_URL: https://CAMBIAR.run.app
CORS_ORIGIN: https://CAMBIAR.run.app

# SQL Server en Cloud SQL (IP privada de la instancia; la contraseña está en el secreto db-password)
DB_SERVER: "10.29.0.3"                # IP privada de Cloud SQL (gestion-sql)
DB_PORT: "1433"
DB_DATABASE: GestionMultiservicios
DB_USER: sqlserver
DB_ENCRYPT: "true"

# Facturación electrónica: con ECF_API_URL se emite por la plataforma e-CF (la clave está en el secreto ecf-api-key)
ECF_API_URL: https://ecf-platform-backend-50801509587.us-central1.run.app

